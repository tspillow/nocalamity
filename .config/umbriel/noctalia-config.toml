[audio]
colorize_icons = true
enable_overdrive = true

[bar.default]
background_opacity = 0.54999998770654202
end = [ "tray", "bar", "wallpaper", "notifications", "group:g1" ]
font_family = "GoMono Nerd Font Propo"
margin_ends = 430
position = "bottom"
radius = 80
reserve_space = false
shadow = false
smart_auto_hide = true
start = [ "control-center", "launcher", "workspaces", "audio_visualizer" ]
thickness = 38
widget_spacing = 3

    [[bar.default.capsule_group]]
    accordion = true
    accordion_direction = "end"
    border_width = 1.0
    enabled = true
    fill = "on_primary_container"
    id = "g1"
    members = [ "cat_2", "widget", "battery", "bluetooth", "volume", "brightness", "session" ]
    opacity = 0.05000000074505806
    padding = 6.0
    widget_spacing = 9

[control_center]
hidden_tabs = [ "screen-time" ]
width = 1160

    [[control_center.shortcuts]]
    type = "wifi"

    [[control_center.shortcuts]]
    type = "bluetooth"

    [[control_center.shortcuts]]
    type = "caffeine"

    [[control_center.shortcuts]]
    type = "nightlight"

    [[control_center.shortcuts]]
    type = "power_profile"

    [[control_center.shortcuts]]
    type = "notification"

[desktop_widgets]
schema_version = 2
widget_order = [ "desktop-widget-0000000000000001" ]

    [desktop_widgets.grid]
    cell_size = 8
    major_interval = 4
    visible = true

    [desktop_widgets.widget.desktop-widget-0000000000000001]
    box_height = 176.0
    box_width = 1920.0
    cx = 960.0
    cy = 1036.0
    output = "eDP-1"
    placement_height = 1080.0
    placement_width = 1920.0
    rotation = -0.0
    type = "audio_visualizer"

        [desktop_widgets.widget.desktop-widget-0000000000000001.settings]
        background = false
        bands = 60
        centered = false
        mirrored = false
        show_wave = true
        show_when_idle = true

[lockscreen]
blurred_desktop = true

[lockscreen_widgets]
enabled = true
schema_version = 2
widget_order = [ "lockscreen-login-box@eDP-1", "lockscreen-widget-0000000000000001", "lockscreen-widget-0000000000000002" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@eDP-1"]
    box_height = 70.0
    box_width = 400.0
    cx = 960.0
    cy = 734.0
    output = "eDP-1"
    placement_height = 1080.0
    placement_width = 1920.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@eDP-1".settings]
        background_color = "surface_container"
        background_opacity = 0.82000000000000006
        background_radius = 32.0
        center_password_text = false
        input_opacity = 0.68000000000000005
        input_radius = 32.0
        layout = "compact"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_media_controls = true
        show_password_reveal = true
        show_session_buttons = true
        show_unlock_hint = false
        show_weather = true

    [lockscreen_widgets.widget.lockscreen-widget-0000000000000001]
    box_height = 192.0
    box_width = 496.0
    cx = 960.0
    cy = 508.0
    output = "eDP-1"
    placement_height = 1080.0
    placement_width = 1920.0
    rotation = 0.0
    type = "clock"

        [lockscreen_widgets.widget.lockscreen-widget-0000000000000001.settings]
        background = false
        clock_style = "digital"
        color = "primary"
        font_family = "Px437 DOS/V re. JPN30"
        shadow = true

    [lockscreen_widgets.widget.lockscreen-widget-0000000000000002]
    box_height = 688.0
    box_width = 1920.0
    cx = 960.0
    cy = 1076.0
    output = "eDP-1"
    placement_height = 1080.0
    placement_width = 1920.0
    rotation = 0.0
    type = "audio_visualizer"

        [lockscreen_widgets.widget.lockscreen-widget-0000000000000002.settings]
        background = false
        bands = 32
        reversed = false
        show_wave = false
        show_when_idle = true

[notification]
background_opacity = 0.65999998524785042
border = false
colorize_icons = true
position = "bottom_right"
scale = 0.90000000596046448
width = 380

[osd]
background_opacity = 0.57999998703598976
offset_y = 43
position = "bottom_center"
position_vertical = "bottom_right"

    [osd.kinds]
    lock_keys = false

[plugins]
enabled = [ "noctalia/bongocat", "vn1k/cursor", "noctalia/umbriel-companion" ]

[shell]
corner_radius_scale = 1.9500000290572643
font_family = "GoMono Nerd Font Propo"
password_style = "random"
polkit_colorize_icons = true
settings_window_translucent = true
show_close_buttons = false
umbriel_audio_provider_enabled = true
umbriel_overview_type_to_launch_enabled = true

    [shell.animation]
    speed = 0.80000001192092896

    [shell.launcher]
    width = 990

    [shell.panel]
    launcher_placement = "attached"
    session_placement = "floating"
    session_position = "bottom_center"
    shadow = false
    transparency_mode = "glass"
    wallpaper_position = "center"
    wallpaper_show_names = false

    [[shell.session.actions]]
    action = "lock"
    countdown_seconds = 0.0
    enabled = true
    shortcut = "1"
    variant = "default"

    [[shell.session.actions]]
    action = "logout"
    countdown_seconds = 0.0
    enabled = true
    shortcut = "2"
    variant = "default"

    [[shell.session.actions]]
    action = "lock_and_suspend"
    countdown_seconds = 0.0
    enabled = true
    shortcut = "3"
    variant = "default"

    [[shell.session.actions]]
    action = "reboot"
    countdown_seconds = 0.0
    enabled = true
    shortcut = "4"
    variant = "default"

    [[shell.session.actions]]
    action = "shutdown"
    countdown_seconds = 0.0
    enabled = true
    shortcut = "5"
    variant = "destructive"

    [[shell.session.actions]]
    action = "lock_and_suspend"
    command = "notify-send 'Noctalia' 'Custom session entry'"
    countdown_seconds = 0.0
    enabled = true
    variant = "default"

[theme]
community_palette = "Seoul256 Soft"
source = "wallpaper"

    [theme.templates]
    builtin_ids = [ "btop", "cava", "foot", "gtk3", "gtk4", "kcolorscheme", "qt", "umbriel" ]
    community_ids = [ "discord", "neovim", "rofi", "fastfetch", "thunar", "fzf", "glow", "konsole" ]

[wallpaper]
directory = "/home/pillow/Pictures/Wallpapers"

    [wallpaper.default]
    path = "/home/pillow/Pictures/Wallpapers/6.jpeg"

    [wallpaper.last]
    path = "/home/pillow/Pictures/Wallpapers/6.jpeg"

    [wallpaper.monitors.eDP-1]
    path = "/home/pillow/Pictures/Wallpapers/6.jpeg"

    [[wallpaper.favorite]]
    palette_source = "wallpaper"
    path = "/home/pillow/Pictures/Wallpapers/2.jpg"
    theme_mode = "dark"
    wallpaper_scheme = "m3-content"

    [[wallpaper.favorite]]
    palette_source = "wallpaper"
    path = "/home/pillow/Pictures/Wallpapers/1.jpg"
    theme_mode = "dark"
    wallpaper_scheme = "m3-content"

    [[wallpaper.favorite]]
    palette_source = "wallpaper"
    path = "/home/pillow/Pictures/Wallpapers/3.jpg"
    theme_mode = "dark"
    wallpaper_scheme = "m3-content"

    [[wallpaper.favorite]]
    palette_source = "wallpaper"
    path = "/home/pillow/Pictures/Wallpapers/4.png"
    theme_mode = "dark"
    wallpaper_scheme = "m3-content"

    [[wallpaper.favorite]]
    path = "/home/pillow/Pictures/Wallpapers/5.jpg"

    [[wallpaper.favorite]]
    palette_source = "wallpaper"
    path = "/home/pillow/Pictures/Wallpapers/6.jpeg"
    theme_mode = "dark"
    wallpaper_scheme = "m3-content"

[widget.audio_visualizer]
color = "primary"
mirrored = false
show_glyph = false
show_wave = true
show_when_idle = true
width = 214

[widget.bar]
type = "noctalia/umbriel-companion:bar"

[widget.cat_2]
audio_spectrum = true
executable_path = "/usr/bin/evtest"
input_devices = [ "/dev/input/event2" ]
tappy_mode = true
type = "noctalia/bongocat:cat"

[widget.control-center]
custom_image = "/home/pillow/Pictures/ikons/archinux-transparent.png"
custom_image_colorize = true
glyph = "navigation-filled"
icon_color = "primary"

[widget.widget]
type = "vn1k/cursor:widget"
