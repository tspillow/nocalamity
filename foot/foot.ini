
[main]
include=~/.config/foot/themes/noctalia
shell=/usr/bin/fish
font=GoMono Nerd Font Propo:size=14
pad=22x18 center
selection-target=clipboard

[cursor]
style=beam
beam-thickness=1
blink=yes
blink-rate=600

[csd]
preferred=none
[scrollback]
lines=10000
indicator-position=none

[colors-dark]
alpha=0.6
[mouse]
hide-when-typing=yes
